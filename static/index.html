<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preflight Companion — check before you build</title>
  <meta name="description" content="A local-first study coach for engineering students. Audit an assignment brief, check a draft, remember past submissions, and get a short completion plan. Nothing leaves this machine.">
  <meta name="theme-color" content="#f1ebde">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead">
    <a class="brand" href="/" aria-label="Preflight Companion home">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="14.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M20 5.5v5M20 29.5v5M5.5 20h5M29.5 20h5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M25.5 14.5 22 22l-7.5 3.5L18 18z" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="20" cy="20" r="1.7" fill="currentColor"/>
      </svg>
      <span class="wordmark">Preflight</span>
      <span class="brand-tag">companion / local study desk</span>
    </a>
    <nav class="top-nav" aria-label="Primary">
      <button class="nav-link" id="demoButton" type="button">Load demo</button>
      <button class="nav-link" id="memoryButton" type="button">Memory</button>
      <span class="model-pill" id="modelPill" title="Inference runs on this machine">
        <span class="status-dot" id="statusDot"></span>
        <span id="modelLabel">checking model</span>
      </span>
    </nav>
  </header>

  <div class="shell">
    <aside class="rail" aria-label="Assignments">
      <div class="rail-head">
        <div>
          <p class="eyebrow"><span>01</span> Your desk</p>
          <h2>Assignments</h2>
        </div>
        <button class="icon-button" id="newAssignmentButton" type="button" aria-label="New assignment" title="New assignment">+</button>
      </div>
      <div class="deadline-strip" id="deadlineStrip" hidden></div>
      <div class="assignment-list" id="assignmentList" aria-live="polite">
        <div class="rail-empty">Loading the desk…</div>
      </div>
      <footer class="rail-foot">
        <span class="local-dot"></span>
        <div>
          <b>Local only</b>
          <span>Briefs, drafts and chat stay in <code>data/preflight.db</code>.</span>
        </div>
      </footer>
    </aside>

    <main id="main" class="main" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <p class="eyebrow"><span>NEW</span> Preflight</p>
          <h2 id="modalTitle">Add an assignment</h2>
        </div>
        <button class="icon-button" id="modalClose" type="button" aria-label="Close">×</button>
      </div>
      <form id="assignmentForm" class="modal-body" novalidate>
        <div class="field-grid">
          <label class="field">
            <span class="field-label">Course code</span>
            <input id="courseCode" name="courseCode" type="text" placeholder="ENG 204" maxlength="24" autocomplete="off">
          </label>
          <label class="field">
            <span class="field-label">Course title <span class="optional">optional</span></span>
            <input id="courseTitle" name="courseTitle" type="text" placeholder="Engineering Design Studio" maxlength="120" autocomplete="off">
          </label>
        </div>
        <label class="field">
          <span class="field-label">Assignment title</span>
          <input id="assignmentTitle" name="title" type="text" placeholder="Design Task 4 — Bridge Deck Load Path" maxlength="160" required autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">Deadline <span class="optional">optional</span></span>
          <input id="assignmentDeadline" name="deadline" type="datetime-local">
        </label>
        <label class="field">
          <span class="field-label">Brief</span>
          <span class="field-help">Paste the brief. The app extracts requirements from the text; the model cannot invent them.</span>
          <textarea id="assignmentBrief" name="brief" rows="7" placeholder="Paste the assignment brief here…" required></textarea>
        </label>
        <div class="modal-actions">
          <button class="button ghost" type="button" id="modalCancel">Cancel</button>
          <button class="button primary" type="submit">Create and preflight</button>
        </div>
        <p class="form-error" id="assignmentError" role="alert" hidden></p>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
